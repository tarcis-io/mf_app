name: CI

# Lint, test, and build on every push to main and on pull requests.
# This gates regressions (like a broken lint toolchain or type error) before
# they reach a deploy. Deployment to Cloud Run is intentionally NOT wired here
# yet — see the commented stub at the bottom and DEPLOYMENT.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager".

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # The build reads no secrets (auth config is read at runtime), so no
          # AUTH_* vars are needed here.

